"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:blue)\
[󰫢](fg:teal bg:blue)\
$username\
$directory\
$time\
[ ](fg:blue)\
$cmd_duration\
$character"""

palette = 'leoneed'

[username]
show_always = true
style_user = "bg:blue fg:teal"
style_root = "bg:blue fg:teal"
format = '[ $user]($style)'

[directory]
style = "bg:blue fg:teal"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰎇 "
"Pictures" = " "

[time]
disabled = false
time_format = "%R"
format = '[[ $time ](fg:teal bg:blue)]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:teal)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.leoneed]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#910000"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#00e64a"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#4455dd"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
