monitor=DP-2,1920x1080@239.76Hz,0x0,1
monitor=HDMI-A-2,preffered,auto,1,transform,0
monitor=,preferred,auto,auto


device {
	name=huion-huion-tablet_gs1333-pen
	output=HDMI-A-2
	transform=0
}

# Environment stuff (waybar for taskbar, awww for wallpaper, fcitx5 for keyboard languages, dunst for notifications)
exec-once = waybar & awww-daemon & fcitx5 & dunst
# Start obs w/ replay buffer running
exec-once = obs --startreplaybuffer

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Dark Mode Stuff Allegedly
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    # Active tab is L/N blue + shiho green gradient
    col.active_border = rgba(4455DDff) rgba(BBDD22ff) 330deg
    # Inactive tabs have border w/ colors of each group member
    col.inactive_border = rgba(4455DDaa) rgba(BBDD22aa) rgba(EE6666aa) rgba(33AAEEaa) rgba(FFDD44aa) 330deg

    layout = dwindle
}

decoration {
    rounding = 7
    rounding_power = 2

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = curve, 0.4, 0, 0.2, 1
    animation = windows,      1, 2, curve, slide
    animation = windowsOut,   1, 2, curve, slide
    animation = fade,         1, 2, curve
    animation = workspaces,   1, 3, curve, slidevert
    animation = border,        1,     5.39,  curve
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1 
    disable_hyprland_logo = true
}

input {
    follow_mouse = 1
    sensitivity = -0.5

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, R, exec, rofi -show run
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, dolphin
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, Z, togglefloating

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = ALT, TAB, workspace, e+1
bind = ALT SHIFT, TAB, workspace, e-1

bindd = $mainMod CTRL, F9, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, move workspace to down monitor, movecurrentworkspacetomonitor, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = CTRL + SHIFT, SEMICOLON, exec, hyprshot -m region


windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrulev = fullscreen,class:^steam_app_\d+$
windowrulev = monitor 1,class:^steam_app_\d+$
windowrulev = workspace 10,class:^steam_app_\d+$
workspace = 10, border:false, rounding:false

windowrule = workspace 1 silent, match:class brave-browser
windowrule = workspace 2 silent, match:class code-oss
windowrule = workspace 3 silent, match:class kitty
windowrule = workspace 4 silent, match:class discord
windowrule = workspace 5 silent, match:class steam

# Maybe needed for obs recording and screensharing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
